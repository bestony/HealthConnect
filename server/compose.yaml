# HTTP service for healthd.
# Terminate TLS in the platform in front of this container. CapRover does that.
# Run one healthd container on one data volume. DuckDB accepts one writer.

name: healthconnect

services:
  healthd:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: healthconnect-healthd:local
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATA_DIR: /var/lib/healthconnect
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8589934592}
      MAX_UNCOMPRESSED_BYTES: ${MAX_UNCOMPRESSED_BYTES:-17179869184}
    ports:
      - "8080:8080"
    volumes:
      - health-data:/var/lib/healthconnect
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  health-data:
    name: healthconnect-data
